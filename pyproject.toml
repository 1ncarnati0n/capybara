[project]
name = "en2ko"
version = "0.1.0"
description = "English-to-Korean EPUB translator using a local LLM (llama.cpp + EXAONE 3.5)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "epub-translator>=0.1.9",
]

[project.optional-dependencies]
download = [
    "huggingface_hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
